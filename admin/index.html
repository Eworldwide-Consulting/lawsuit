<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TriVanta — Admin Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f2057 0%, #0d1b4e 60%, #071236 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2rem;
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: #0f2057;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg { width: 22px; height: 22px; fill: #fff; }
    .logo-text { font-size: 1.15rem; font-weight: 700; color: #0f2057; }
    .logo-sub  { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; }

    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: #f1f5f9; color: #475569;
      font-size: 0.72rem; font-weight: 600;
      padding: 4px 10px; border-radius: 20px;
      margin-bottom: 1.25rem;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #94a3b8; }

    h1 { font-size: 1.45rem; font-weight: 700; color: #0f1a2e; margin-bottom: 0.25rem; }
    p.sub { font-size: 0.85rem; color: #64748b; margin-bottom: 1.75rem; }

    label { display: block; font-size: 0.8rem; font-weight: 600; color: #374151; margin-bottom: 5px; }

    .field { margin-bottom: 1.1rem; }

    .input-wrap { position: relative; }
    .input-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: #9ca3af; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    input[type=email], input[type=password], input[type=text] {
      width: 100%; padding: 10px 12px 10px 38px;
      border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: 0.9rem; color: #1e293b;
      outline: none; transition: border-color 0.15s;
      background: #f8fafc;
    }
    input:focus { border-color: #0f2057; background: #fff; }

    .pwd-toggle {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 4px;
      color: #9ca3af;
    }
    .pwd-toggle:hover { color: #475569; }
    .pwd-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .error-box {
      display: none;
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 8px; padding: 10px 14px;
      font-size: 0.83rem; color: #dc2626;
      margin-bottom: 1rem;
    }
    .error-box.show { display: block; }

    button[type=submit] {
      width: 100%; padding: 11px;
      background: #0f2057; color: #fff;
      border: none; border-radius: 8px;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 0.5rem;
    }
    button[type=submit]:hover:not(:disabled) { background: #1a3580; }
    button[type=submit]:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-note {
      margin-top: 1.5rem; text-align: center;
      font-size: 0.75rem; color: #94a3b8;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .footer-note svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; }

    .redirect-msg {
      display: none; text-align: center;
      padding: 1rem; color: #16a34a;
      font-size: 0.9rem; font-weight: 500;
    }
    .redirect-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div>
        <div class="logo-text">TriVanta</div>
        <div class="logo-sub">Legal Compliance</div>
      </div>
    </div>

    <!-- Admin badge -->
    <div class="badge">
      <span class="badge-dot"></span>
      System Administration
    </div>

    <h1>Admin Portal</h1>
    <p class="sub">Sign in to manage users and approvals.</p>

    <!-- Error -->
    <div class="error-box" id="errorBox"></div>
    <!-- Redirect message -->
    <div class="redirect-msg" id="redirectMsg">✓ Authenticated — redirecting…</div>

    <!-- Form -->
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <!-- mail icon -->
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 7L2 7"/></svg>
          <input id="email" name="email" type="email" placeholder="admin@firm.com" required autocomplete="email" />
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <!-- lock icon -->
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="password" name="password" type="password" placeholder="Enter your password" required autocomplete="current-password" />
          <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="Toggle password visibility">
            <svg id="eyeShow" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeHide" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn">
        <svg style="width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;flex-shrink:0" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span id="submitLabel">Sign In</span>
        <div class="spinner" id="spinner" style="display:none"></div>
      </button>
    </form>

    <div class="footer-note">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Protected with secure encryption
    </div>
  </div>

  <script>
    const API_BASE  = 'https://gkasevault.io';
    const MAIN_APP  = 'https://gkasevault.io';

    const form       = document.getElementById('loginForm');
    const emailEl    = document.getElementById('email');
    const pwdEl      = document.getElementById('password');
    const submitBtn  = document.getElementById('submitBtn');
    const submitLbl  = document.getElementById('submitLabel');
    const spinner    = document.getElementById('spinner');
    const errorBox   = document.getElementById('errorBox');
    const redirectMsg= document.getElementById('redirectMsg');
    const pwdToggle  = document.getElementById('pwdToggle');
    const eyeShow    = document.getElementById('eyeShow');
    const eyeHide    = document.getElementById('eyeHide');

    pwdToggle.addEventListener('click', () => {
      const show = pwdEl.type === 'password';
      pwdEl.type     = show ? 'text' : 'password';
      eyeShow.style.display = show ? 'none'  : '';
      eyeHide.style.display = show ? ''      : 'none';
    });

    function setLoading(on) {
      submitBtn.disabled      = on;
      spinner.style.display   = on ? 'block' : 'none';
      submitLbl.textContent   = on ? 'Signing in…' : 'Sign In';
    }

    function showError(msg) {
      errorBox.textContent  = msg;
      errorBox.classList.add('show');
    }

    function clearError() {
      errorBox.classList.remove('show');
      errorBox.textContent = '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      setLoading(true);

      try {
        const res = await fetch(`${API_BASE}/api/auth/login`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({
            email:    emailEl.value.trim(),
            password: pwdEl.value,
            portal:   'itsupport',
          }),
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Invalid email or password. Please try again.');
          setLoading(false);
          return;
        }

        if (data.twoFaRequired) {
          // Store temp token and redirect to the 2FA verification page
          const params = new URLSearchParams({ adminTempToken: data.tempToken });
          window.location.href = `${MAIN_APP}/verify?${params}`;
          return;
        }

        if (data.otpRequired) {
          // Email verification code sent — finish sign-in on the main app's
          // verify page (mode/email passed via URL: sessionStorage does not
          // cross the admin subdomain origin).
          const params = new URLSearchParams({
            adminTempToken: data.tempToken,
            mode:  'email',
            email: data.maskedEmail || '',
          });
          window.location.href = `${MAIN_APP}/verify?${params}`;
          return;
        }

        // Confirm the logged-in user is actually an admin
        if (data.user && data.user.role !== 'itsupport') {
          showError('This account does not have admin access. Please use the main portal at gkasevault.io.');
          setLoading(false);
          return;
        }

        // Pass token to main app via AuthCallback — same pattern as Google/Microsoft SSO
        redirectMsg.classList.add('show');
        form.style.display = 'none';

        const callbackParams = new URLSearchParams({ token: data.token, provider: 'admin' });
        window.location.href = `${MAIN_APP}/auth/callback?${callbackParams}`;

      } catch (err) {
        showError('Network error. Please check your connection and try again.');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
