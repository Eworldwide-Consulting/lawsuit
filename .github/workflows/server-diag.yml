# Manual server diagnostic — hunts the agent that reverts client/dist to a
# June 10 copy between CI deploys (suspect: hPanel Git deployment or cron).
name: Server Diagnostic

on: workflow_dispatch

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Hunt stale-copy sources
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh \
            -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -l -c '
              D=\"${{ secrets.DEPLOY_PATH }}\"
              echo \"=== current dist state ===\"
              ls -la \"\$D/client/dist/index.html\"
              grep -oE \"assets/index-[A-Za-z0-9_-]+\\.js\" \"\$D/client/dist/index.html\" | head -1
              echo \"=== .git inside deploy path? (hPanel git deploy) ===\"
              if [ -d \"\$D/.git\" ]; then
                echo \"YES — .git exists\"
                cd \"\$D\" && git log -1 --format=\"%h %ad %s\" --date=iso 2>/dev/null
                git remote -v 2>/dev/null | head -2
                git status --short 2>/dev/null | head -5
              else
                echo \"no .git in deploy path\"
              fi
              echo \"=== hPanel git clone dirs ===\"
              ls -d ~/repositories ~/git ~/.hostinger* 2>/dev/null || echo \"(none)\"
              ls ~/repositories 2>/dev/null | head -5
              echo \"=== cron jobs ===\"
              crontab -l 2>/dev/null || echo \"(no crontab)\"
              echo \"=== _backup dist state ===\"
              ls -la \"\$D/_backup/client/dist/index.html\" 2>/dev/null || echo \"(no backup dist)\"
              grep -oE \"assets/index-[A-Za-z0-9_-]+\\.js\" \"\$D/_backup/client/dist/index.html\" 2>/dev/null | head -1
              echo \"=== other dist copies under domains ===\"
              find ~/domains -maxdepth 6 -name \"index.html\" -path \"*dist*\" -newer /dev/null 2>/dev/null | head -10
            '"
