name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

# ---------------------------------------------------------------------------
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions):
#
#   SSH_HOST        92.112.187.20
#   SSH_USER        u511005792
#   SSH_PORT        65002
#   SSH_PASSWORD    <Hostinger SSH password>
#   DEPLOY_PATH     /home/u511005792/domains/gkasevault.io/nodejs
#
#   JWT_SECRET      <64-char hex>
#   DATABASE_URL    mysql://u511005792_dbadmin:<pass>@127.0.0.1:3306/u511005792_lawsuit
#   SMTP_USER       <gmail address>
#   SMTP_PASS       <gmail app password>
# ---------------------------------------------------------------------------

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_COLOR: 1

    steps:
      # -- 1. Checkout -------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -- 2. Node 22 (matches Hostinger server) -----------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package.json

      # -- 3. Build React (Ubuntu binary - compatible with Hostinger Linux) --
      - name: Install client dependencies
        run: npm install --prefix client

      - name: Build React app
        run: npm run build --prefix client

      # -- 4. sshpass (password-based SSH/rsync) -----------------------------
      - name: Install sshpass
        run: sudo apt-get install -y sshpass netcat-openbsd

      # -- 4b. Pre-flight: verify TCP port is reachable before rsync ---------
      # "Connection timed out" means GitHub runner cannot reach host:port.
      # This step prints the exact failure cause and fails fast.
      - name: SSH connectivity pre-check
        run: |
          echo "Testing TCP connectivity to ${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT }} ..."
          if nc -z -w 15 ${{ secrets.SSH_HOST }} ${{ secrets.SSH_PORT }}; then
            echo "TCP port reachable"
          else
            echo ""
            echo "ERROR: Cannot reach ${{ secrets.SSH_HOST }}:${{ secrets.SSH_PORT }}"
            echo ""
            echo "Checklist - fix whichever applies:"
            echo "  1. hPanel -> Advanced -> SSH Access -> confirm SSH is ENABLED (green)"
            echo "  2. The SSH port shown in hPanel matches the SSH_PORT GitHub Secret"
            echo "  3. SSH_HOST secret = the server IP shown in hPanel (not a domain alias)"
            echo "  4. Hostinger free/starter plans do not support SSH - upgrade required"
            exit 1
          fi

      # -- 5a. Backup current deployment for rollback ---------------------------
      # Snapshot the live files to _backup/ before overwriting them.
      # Non-fatal: if there is no previous deployment the rsync simply skips.
      - name: Backup current deployment
        continue-on-error: true
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh \
            -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -l -c '
              if [ -d \"${{ secrets.DEPLOY_PATH }}/server/src\" ]; then
                mkdir -p \"${{ secrets.DEPLOY_PATH }}/_backup\"
                rsync -a \
                  --exclude node_modules \
                  --exclude _backup \
                  --exclude logs \
                  --exclude uploads \
                  --exclude \"*.db\" \
                  \"${{ secrets.DEPLOY_PATH }}/\" \"${{ secrets.DEPLOY_PATH }}/_backup/\"
                echo \"Backup created at ${{ secrets.DEPLOY_PATH }}/_backup\"
              else
                echo \"No previous deployment found - skipping backup\"
              fi
            '"

      # -- 5. Sync project files ---------------------------------------------
      - name: Sync files to server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e rsync -az --delete \
            --exclude 'node_modules/'        \
            --exclude 'server/node_modules/' \
            --exclude 'client/node_modules/' \
            --exclude 'client/src/'          \
            --exclude '.env'                 \
            --exclude '*.db'                 \
            --exclude '*.db-shm'             \
            --exclude '*.db-wal'             \
            --exclude 'uploads/'             \
            --exclude 'logs/'                \
            --exclude '_backup/'             \
            --exclude '.git/'                \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
          echo "Files synced"

      # -- 6. Write .env -----------------------------------------------------
      - name: Write .env on server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          ENV_CONTENT: |
            NODE_ENV=production
            PORT=3000
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=7d
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            MYSQL_SOCKET=/var/lib/mysql/mysql.sock
            CLIENT_URL=https://gkasevault.io
            SERVER_URL=https://gkasevault.io
            SMTP_HOST=smtp.gmail.com
            SMTP_PORT=587
            SMTP_SECURE=false
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=TriVanta Legal <${{ secrets.SMTP_USER }}>
            UPLOAD_DIR=/home/u511005792/domains/gkasevault.io/nodejs/uploads
            MAX_FILE_SIZE_MB=20
            MYSQL_PASS=${{ secrets.MYSQL_PASS }}
            ADMIN_URL=https://admin.gkasevault.io
        run: |
          echo "$ENV_CONTENT" > /tmp/trivanta.env
          sshpass -e scp \
            -P ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            /tmp/trivanta.env \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/.env
          rm -f /tmp/trivanta.env
          echo ".env uploaded"

      # -- 6b. Verify .env landed correctly ----------------------------------
      - name: Verify .env on server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh \
            -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -l -c '
              cd ${{ secrets.DEPLOY_PATH }}
              if [ ! -f .env ]; then
                echo \".env is missing - deploy cannot proceed\"
                exit 1
              fi
              grep -q \"^NODE_ENV=\" .env || { echo \".env missing NODE_ENV\"; exit 1; }
              grep -q \"^DATABASE_URL=\" .env || { echo \".env missing DATABASE_URL\"; exit 1; }
              grep -q \"^JWT_SECRET=\" .env    || { echo \".env missing JWT_SECRET\"; exit 1; }
              echo \".env OK - $(wc -l < .env) lines, NODE_ENV=$(grep NODE_ENV .env | cut -d= -f2)\"
            '"

      # -- 5b. Deploy admin subdomain static files ---------------------------
      - name: Deploy admin login to subdomain
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          ADMIN_PATH="/home/u511005792/domains/gkasevault.io/public_html/admin"
          sshpass -e ssh \
            -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -l -c 'mkdir -p ${ADMIN_PATH}'"
          sshpass -e rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            ./admin/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${ADMIN_PATH}/
          echo "Admin subdomain files deployed to ${ADMIN_PATH}"

      # -- 7. Install server deps on the Linux host --------------------------
      # bash -l ensures NVM / npm are on PATH (non-interactive SSH skips .bashrc)
      - name: Install server production dependencies
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh \
            -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -l -c '
              set -e
              cd ${{ secrets.DEPLOY_PATH }}
              npm install --prefix server --omit=dev
              mkdir -p logs uploads
              chmod 755 uploads
              echo \"Dependencies installed - $(ls server/node_modules 2>/dev/null | wc -l) packages\"
            '"

      # -- 7b. Syntax check before touching the live process -----------------
      # The module check is written to a temp file locally and SCP'd to the server.
      # This avoids shell-quoting conflicts inside single-quoted bash -c strings.
      - name: Pre-restart syntax & module check
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          cat > /tmp/trivanta_modcheck.js << 'JSEOF'
          var path = require('path');
          var base = process.cwd();
          var mods = ['express','mysql2','bcryptjs','jsonwebtoken','multer','dotenv','pino','compression'];
          var missing = [];
          mods.forEach(function(m) {
            try { require(path.join(base, 'server/node_modules', m)); }
            catch(e) { missing.push(m); }
          });
          if (missing.length) {
            console.error('MISSING MODULES: ' + missing.join(', '));
            process.exit(1);
          }
          console.log('Critical modules OK (' + mods.length + ')');
          JSEOF

          sshpass -e scp \
            -P ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            /tmp/trivanta_modcheck.js \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/trivanta_modcheck.js

          sshpass -e ssh \
            -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -l -c 'set -e; cd ${{ secrets.DEPLOY_PATH }}; node --check server/src/index.js && echo \"Syntax OK\"; node /tmp/trivanta_modcheck.js; rm -f /tmp/trivanta_modcheck.js && echo \"Module check done\"'"

      # -- 8. Restart application --------------------------------------------
      - name: Restart application
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh \
            -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -l -c '
              cd ${{ secrets.DEPLOY_PATH }}
              if command -v pm2 &>/dev/null; then
                pm2 restart trivanta 2>/dev/null \
                  || (pm2 start ecosystem.config.js --env production && pm2 save)
                echo \"Restarted via PM2\"
              else
                touch server/src/index.js
                echo \"Restarted via hPanel touch trigger\"
              fi
            '"

      # -- 9. Health check - retry loop (up to 120 s) ------------------------
      # Polls /api/health every 8 s, 15 attempts.
      # Accounts for: hPanel restart delay (~20 s) + DB init/migrations (~30 s).
      - name: Health check (retry loop)
        run: |
          echo "Polling https://gkasevault.io/api/health - up to 120 s..."
          MAX=15
          DELAY=8
          for i in $(seq 1 $MAX); do
            printf "  Attempt %d/%d ... " "$i" "$MAX"
            HTTP=$(curl -s -o /tmp/health.json \
                        -w "%{http_code}" \
                        --max-time 12 \
                        https://gkasevault.io/api/health 2>/dev/null || echo "000")

            if [ "$HTTP" = "200" ]; then
              STATUS=$(python3 -c \
                "import json,sys; d=json.load(open('/tmp/health.json')); print(d.get('status','?'))" \
                2>/dev/null || echo "?")

              if [ "$STATUS" = "ok" ]; then
                echo "HTTP $HTTP - healthy"
                python3 - <<'PYEOF'
          import json, sys
          try:
              d = json.load(open('/tmp/health.json'))
              mem = round(d.get('memory', {}).get('rss', 0) / 1048576, 1)
              print(f"  env     : {d.get('env')}")
              print(f"  uptime  : {d.get('uptime')} s")
              print(f"  memory  : {mem} MB RSS")
              print(f"  db      : {d.get('db')}")
              print(f"  version : {d.get('version')}")
          except Exception as e:
              print(f"  (could not parse response: {e})")
          PYEOF
                exit 0
              fi

              echo "HTTP $HTTP but status='$STATUS' - waiting..."
            else
              echo "HTTP $HTTP - waiting..."
            fi

            if [ "$i" -lt "$MAX" ]; then
              sleep $DELAY
            fi
          done

          echo ""
          echo "ERROR: App did not become healthy after $((MAX * DELAY)) s"
          echo "   Last response:"
          cat /tmp/health.json 2>/dev/null || echo "   (no response body)"
          exit 1

      # -- 10a. Rollback to previous deployment on failure -------------------
      # Restores the _backup/ snapshot taken before the new files were pushed,
      # then restarts the app so the previous working version goes live again.
      # continue-on-error so that a rollback failure still lets log dump run.
      - name: Rollback to previous deployment
        if: failure()
        continue-on-error: true
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          echo "============================================"
          echo " ROLLING BACK to previous deployment..."
          echo "============================================"
          sshpass -e ssh \
            -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -l -c '
              BACKUP=\"${{ secrets.DEPLOY_PATH }}/_backup\"
              if [ ! -d \"\$BACKUP/server/src\" ]; then
                echo \"No valid backup found at \$BACKUP - skipping rollback\"
                exit 0
              fi
              echo \"Restoring files from \$BACKUP ...\"
              rsync -a \
                --exclude node_modules \
                --exclude _backup \
                --exclude logs \
                --exclude uploads \
                --exclude \"*.db\" \
                \"\$BACKUP/\" \"${{ secrets.DEPLOY_PATH }}/\"
              echo \"Files restored - restarting application...\"
              cd \"${{ secrets.DEPLOY_PATH }}\"
              if command -v pm2 &>/dev/null; then
                pm2 restart trivanta 2>/dev/null || true
                echo \"Restarted via PM2\"
              else
                touch server/src/index.js
                echo \"Restarted via hPanel touch trigger\"
              fi
              echo \"ROLLBACK COMPLETE - previous version is live\"
            '" || true

      # -- 10. Dump logs on failure (always runs after a failed step) --------
      - name: Dump server logs on failure
        if: failure()
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          echo "============================================"
          echo " DEPLOYMENT FAILED - diagnostic output"
          echo "============================================"

          sshpass -e ssh \
            -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -l -c '
              cd ${{ secrets.DEPLOY_PATH }}

              echo \"--- Process check ---\"
              if command -v pm2 &>/dev/null; then
                pm2 list 2>/dev/null || true
                echo \"--- PM2 log tail ---\"
                pm2 logs trivanta --lines 80 --nostream 2>/dev/null || true
              fi

              echo \"--- app.log tail (last 80 lines) ---\"
              tail -n 80 logs/app.log 2>/dev/null || echo \"(no logs/app.log)\"

              echo \"--- error.log tail (last 40 lines) ---\"
              tail -n 40 logs/error.log 2>/dev/null || echo \"(no logs/error.log)\"

              echo \"--- .env key audit ---\"
              echo \"  NODE_ENV   = $(grep -m1 ^NODE_ENV   .env | cut -d= -f2-)\"
              echo \"  PORT       = $(grep -m1 ^PORT       .env | cut -d= -f2-)\"
              echo \"  DB set     = $(grep -q ^DATABASE_URL .env && echo yes || echo NO - MISSING)\"
              echo \"  JWT set    = $(grep -q ^JWT_SECRET   .env && echo yes || echo NO - MISSING)\"

              echo \"--- Disk usage ---\"
              df -h . 2>/dev/null | tail -1

              echo \"--- node_modules size ---\"
              du -sh server/node_modules 2>/dev/null || echo \"(missing)\"

              echo \"--- client/dist exists ---\"
              ls -lh client/dist/index.html 2>/dev/null || echo \"(client/dist missing - React build not synced)\"
            '" || true

          echo ""
          echo "Check the hPanel Logs panel at: https://hpanel.hostinger.com"

      # -- 11. Email notification on failure ---------------------------------
      # SMTP_PASS must be a Gmail App Password (NOT your Google account password).
      # Generate one at: myaccount.google.com -> Security -> 2-Step Verification -> App passwords
      # continue-on-error: true so a bad SMTP secret does not mask the real failure reason.
      - name: Send failure email notification
        if: failure()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "Deploy FAILED - gkasevault.io - ${{ github.ref_name }}"
          to: ${{ secrets.SMTP_USER }}
          from: TriVanta Deploy <${{ secrets.SMTP_USER }}>
          body: |
            Deployment to gkasevault.io has FAILED.

            Branch   : ${{ github.ref_name }}
            Commit   : ${{ github.sha }}
            Pushed by: ${{ github.actor }}

            Full logs:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            -- TriVanta CI/CD