name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from GitHub → Actions tab

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets (Settings → Secrets and variables → Actions → New):
#
#   SSH_HOST        92.112.187.20
#   SSH_USER        u511005792
#   SSH_PORT        65002
#   SSH_PASSWORD    <your Hostinger SSH password>
#   DEPLOY_PATH     /home/u511005792/domains/gkasevault.io/nodejs
#
#   JWT_SECRET      <64-char hex — run: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))">
#   DATABASE_URL    mysql://u511005792_dbadmin:<DB_PASS>@srv1619.hstgr.io:3306/u511005792_lawsuit
#   SMTP_USER       <your Gmail address>
#   SMTP_PASS       <your Gmail app password (16 chars)>
#
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node.js 20 ────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package.json

      # ── 3. Build React frontend (runs on Ubuntu — binary-compatible with server) ──
      - name: Install client dependencies
        run: npm install --prefix client

      - name: Build React app
        run: npm run build --prefix client
        # Produces client/dist/ — served directly by Express in production

      # ── 4. Install sshpass (needed for password-based SSH/rsync) ─────────────
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      # ── 5. Sync project files to server ──────────────────────────────────────
      - name: Sync files to server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e rsync -az --delete \
            --exclude 'node_modules/' \
            --exclude 'server/node_modules/' \
            --exclude 'client/node_modules/' \
            --exclude 'client/src/' \
            --exclude '.env' \
            --exclude '*.db' \
            --exclude '*.db-shm' \
            --exclude '*.db-wal' \
            --exclude 'uploads/' \
            --exclude 'logs/' \
            --exclude '.git/' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # ── 6. Write .env on server (overwrites on every deploy to stay in sync) ──
      - name: Write .env on server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          ENV_CONTENT: |
            NODE_ENV=production
            PORT=3000
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=7d
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            MYSQL_SOCKET=/var/lib/mysql/mysql.sock
            CLIENT_URL=https://gkasevault.io
            SERVER_URL=https://gkasevault.io
            SMTP_HOST=smtp.gmail.com
            SMTP_PORT=587
            SMTP_SECURE=false
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=TriVanta Legal <${{ secrets.SMTP_USER }}>
            UPLOAD_DIR=/home/u511005792/domains/gkasevault.io/nodejs/uploads
            MAX_FILE_SIZE_MB=20
        run: |
          echo "$ENV_CONTENT" > /tmp/trivanta.env
          sshpass -e scp \
            -P ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            /tmp/trivanta.env \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/.env
          rm -f /tmp/trivanta.env
          echo "✅ .env deployed"

      # ── 7. Install server dependencies on Linux server ────────────────────────
      # bash -l loads ~/.bashrc / ~/.profile so NVM and npm are on PATH
      - name: Install server production dependencies
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh \
            -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -l -c 'cd ${{ secrets.DEPLOY_PATH }} && \
             npm install --prefix server --omit=dev && \
             mkdir -p logs uploads && \
             chmod 755 uploads && \
             echo ✅ Dependencies installed'"

      # ── 8. Restart application ────────────────────────────────────────────────
      # hPanel restarts the app when the entry file mtime changes (touch trick)
      - name: Restart application
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh \
            -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash -l -c 'cd ${{ secrets.DEPLOY_PATH }} && \
             if command -v pm2 &>/dev/null; then \
               pm2 restart trivanta 2>/dev/null || \
               pm2 start ecosystem.config.js --env production && pm2 save; \
               echo ✅ Restarted via PM2; \
             else \
               touch server/src/index.js; \
               echo ✅ Restarted via hPanel touch trigger; \
             fi'"

      # ── 9. Wait for boot and health-check ────────────────────────────────────
      - name: Health check
        run: |
          echo "Waiting 25s for app to boot..."
          sleep 25
          curl -fsS --max-time 15 https://gkasevault.io/api/health | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          status = d.get('status')
          print('Status:', status)
          print('Env:   ', d.get('env'))
          print('Uptime:', d.get('uptime'), 's')
          if status != 'ok':
            print('HEALTH CHECK FAILED', file=sys.stderr)
            sys.exit(1)
          print('✅ Deployment successful!')
          "
        continue-on-error: true   # don't fail the whole workflow if site is slow to boot